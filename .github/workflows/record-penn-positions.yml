name: Record Penn positions

# Keeps New York Penn position history accruing when nobody has the board
# open: every five minutes it asks the deployed app to refresh the NY board,
# which records any new circuit/track pairings. See
# docs/adr/0005-penn-train-positions.md.
#
# Needs two repository secrets: PENN_RECORD_URL (the deployed
# https://…/api/penn-positions/record URL) and CRON_SECRET (the same value as
# the deployment's CRON_SECRET). Without them the job does nothing.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: record-penn-positions
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh the New York Penn board
        env:
          PENN_RECORD_URL: ${{ secrets.PENN_RECORD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PENN_RECORD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PENN_RECORD_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$PENN_RECORD_URL"
