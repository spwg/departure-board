# The New York Penn collector Worker. Deploy from the repository root:
#   npx wrangler deploy --config collector/wrangler.toml
# and set its secrets once with `npx wrangler secret put <NAME> --config
# collector/wrangler.toml` (see collector/worker.ts for the list).
name = "departure-board-penn-collector"
main = "worker.ts"
# 2025-04-01 or later puts secrets in process.env under nodejs_compat.
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* * * * *"]

# Keeps each run's one-line summary in Workers Logs.
[observability]
enabled = true
