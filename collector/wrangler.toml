# The New York Penn collector Worker. No secrets here; they live in Cloudflare.
# Cloudflare's Workers Builds deploys it on every push to main, with this
# directory as its root (see README.md, "Collector Worker"). To deploy by hand,
# run `npm run collector:deploy` from the repository root. Its secrets are set
# once with `npx wrangler@4 secret put <NAME> --config collector/wrangler.toml`
# (see collector/worker.ts for the list).
name = "departure-board-penn-collector"
main = "worker.ts"
# 2025-04-01 or later puts secrets in process.env under nodejs_compat.
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Cron-only: no public workers.dev or preview URL, since there is no web handler.
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

# Keeps each run's one-line summary in Workers Logs.
[observability]
enabled = true
